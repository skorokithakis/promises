<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Promise made (desktop)</title>
<script src="29501607-c499-4eeb-ba4a-41a173d3053c"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#F3F3F0}
a{color:#18191B}a:hover{color:#000}
@keyframes soak{0%{opacity:0;filter:blur(14px);letter-spacing:0.12em}60%{opacity:.85;filter:blur(2px)}100%{opacity:1;filter:blur(0);letter-spacing:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes seg{from{opacity:0;transform:scaleY(0.2)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F3F3F0; color: #18191B; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column">
  <header style="border-bottom: 1px solid #E2E2DE">
    <nav aria-label="Main" style="max-width: 1120px; margin: 0 auto; padding: 0 32px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
      <a href="DesktopList.dc.html" style="font-size: 28px; text-decoration: none">Promises</a>
      <div style="display: flex; gap: 28px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">
        <a href="DesktopList.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; color: #5E6064">Open</a>
        <a href="DesktopHall.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; color: #5E6064">The hall (31)</a>
      </div>
    </nav>
  </header>

  <main style="flex: 1 1 auto; width: 100%; max-width: 860px; margin: 0 auto; box-sizing: border-box; padding: 120px 32px 80px; display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 20px">
      <span style="font-size: 24px; font-style: italic; color: #5E6064; animation: rise 600ms ease-out both">I promise to</span>
      <p style="margin: 0; font-size: 72px; font-weight: 400; line-height: 1.05; text-wrap: balance; animation: soak 1600ms cubic-bezier(.3,.6,.2,1) 300ms both">Call Mum on Sunday</p>
    </div>

    <div style="display: flex; gap: 4px" aria-hidden="true">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
        <span style="{{d.style}}"></span>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 40px">
      <div style="display: flex; flex-direction: column; gap: 10px; animation: rise 700ms ease-out 2000ms both">
        <p style="margin: 0; font-size: 34px; font-style: italic">You have 30 days to keep it.</p>
        <p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #5E6064">Promised 10 Oct 2026 · the ink runs out 9 Nov 2026</p>
      </div>
      <a href="DesktopList.dc.html" style="height: 56px; padding: 0 32px; border-radius: 28px; border: 1px solid #18191B; color: #18191B; display: flex; align-items: center; text-decoration: none; font-size: 20px; font-style: italic; animation: rise 600ms ease-out 2600ms both">Back to my promises</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var i = 0; i < 30; i++) {
      var a = (1 - i / 30) * 0.88 + 0.12;
      var delay = 1100 + i * 28;
      days.push({ style: 'flex: 1 1 0; height: 18px; border-radius: 1px; transform-origin: bottom; background: rgba(24,25,27,' + a.toFixed(3) + '); animation: seg 360ms ease-out ' + delay + 'ms both' });
    }
    return { days: days };
  }
}
</script>


</body></html>
