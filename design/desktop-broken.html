<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Broken promise No. 31 (desktop)</title>
<script src="70b87b24-2422-4790-964e-28505c38a00e"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#0F0F10}
a{color:#D8D1C3}a:hover{color:#F1EBDD}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}60%{opacity:.7}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <header style="border-bottom: 1px solid #22211F">
    <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 0 32px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
      <a href="DesktopList.dc.html" style="font-size: 28px; text-decoration: none">Promises</a>
      <div style="display: flex; gap: 28px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">
        <a href="DesktopList.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; color: #9A9488">Open</a>
        <a href="DesktopHall.dc.html" aria-current="page" style="min-height: 44px; display: flex; align-items: center; text-decoration: underline; text-underline-offset: 6px">The hall (31)</a>
      </div>
    </nav>
  </header>

  <main style="flex: 1 1 auto; width: 100%; max-width: 860px; margin: 0 auto; box-sizing: border-box; padding: 40px 32px 72px; display: flex; flex-direction: column; gap: 56px">
    <a href="DesktopHall.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #9A9488; text-decoration: none">
      <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      The hall
    </a>

    <article style="display: flex; flex-direction: column; align-items: center; gap: 32px; text-align: center">
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.24em; color: #9A9488">BROKEN PROMISE NO. 31</span>
      <h1 style="margin: 0; font-size: 60px; font-weight: 300; line-height: 1.1; text-wrap: balance">I promised to write the blog post about promises.</h1>
      <div style="width: 48px; height: 1px; background: #4A4842"></div>
      <dl style="margin: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 40px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">
        <div style="display: flex; flex-direction: column; gap: 8px"><dt style="color: #9A9488">Promised</dt><dd style="margin: 0">2 Sep 2026</dd></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><dt style="color: #9A9488">Broken</dt><dd style="margin: 0">2 Oct 2026</dd></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><dt style="color: #9A9488">Opened</dt><dd style="margin: 0">6 times</dd></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><dt style="color: #9A9488">Candles</dt><dd style="margin: 0">{{candles}}</dd></div>
      </dl>
    </article>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 16px">
      <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 24px">
        <button type="button" sc-camel-on-click="{{light}}" aria-pressed="{{lit}}" style="{{candleBtnStyle}}">
          <svg width="14" height="19" sc-camel-view-box="0 0 22 30" aria-hidden="true" style="animation: flicker 3.2s ease-in-out infinite"><path d="M11 1c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C5 9.5 7 6 11 1z" fill="#E3A857"></path></svg>
          {{candleLabel}}
        </button>
        <a href="DesktopMake.dc.html" style="height: 56px; padding: 0 24px; display: flex; align-items: center; color: #D8D1C3; text-decoration: none; font-size: 19px; font-style: italic">Promise it again</a>
      </div>
      <p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #9A9488">This promise cannot be removed.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var lit = !!(this.state && this.state.lit);
    var glow = lit ? 0.24 : 0.09;
    return {
      lit: lit,
      candles: lit ? 4 : 3,
      candleLabel: lit ? 'You lit a candle today' : 'Light a candle',
      light: function () { self.setState({ lit: true }); },
      rootStyle: 'min-height: 100vh; box-sizing: border-box; background: radial-gradient(ellipse 60% 420px at 50% 100%, rgba(227,168,87,' + glow + '), rgba(15,15,16,0) 75%), #0F0F10; color: #D8D1C3; font-family: \'Newsreader\', Georgia, serif; display: flex; flex-direction: column',
      candleBtnStyle: 'display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 32px; border-radius: 28px; border: 1px solid ' + (lit ? '#E3A857' : '#4A4842') + '; background: transparent; color: ' + (lit ? '#E3A857' : '#D8D1C3') + '; font-family: \'Newsreader\', Georgia, serif; font-size: 19px; font-style: italic; cursor: ' + (lit ? 'default' : 'pointer')
    };
  }
}
</script>


</body></html>
