<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Broken promise No. 31</title>
<script src="2d137168-5f3f-4f22-bf13-2af6d46751b8"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#0F0F10}
a{color:#D8D1C3}a:hover{color:#F1EBDD}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}60%{opacity:.7}}
</style>
</helmet>
<div style="{{rootStyle}}">
  <a href="Hall.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #9A9488; text-decoration: none">
    <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
    The hall
  </a>

  <article style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; text-align: center; padding: 0 8px">
    <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.24em; color: #9A9488">BROKEN PROMISE NO. 31</span>
    <h1 style="margin: 0; font-size: 38px; font-weight: 300; line-height: 1.15; text-wrap: balance">I promised to write the blog post about promises.</h1>
    <div style="width: 40px; height: 1px; background: #4A4842"></div>
    <dl style="margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; text-align: left">
      <dt style="color: #9A9488">Promised</dt><dd style="margin: 0">2 Sep 2026</dd>
      <dt style="color: #9A9488">Broken</dt><dd style="margin: 0">2 Oct 2026</dd>
      <dt style="color: #9A9488">Opened</dt><dd style="margin: 0">6 times</dd>
      <dt style="color: #9A9488">Candles</dt><dd style="margin: 0">{{candles}}</dd>
    </dl>
  </article>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <button type="button" sc-camel-on-click="{{light}}" aria-pressed="{{lit}}" style="{{candleBtnStyle}}">
      <svg width="14" height="19" sc-camel-view-box="0 0 22 30" aria-hidden="true" style="animation: flicker 3.2s ease-in-out infinite"><path d="M11 1c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C5 9.5 7 6 11 1z" fill="#E3A857"></path></svg>
      {{candleLabel}}
    </button>
    <a href="Make.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; color: #D8D1C3; text-decoration: none; font-size: 17px; font-style: italic">Promise it again</a>
    <p style="margin: 0; text-align: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #9A9488">This promise cannot be removed.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var lit = !!(this.state && this.state.lit);
    var glow = lit ? 0.26 : 0.1;
    return {
      lit: lit,
      candles: lit ? 4 : 3,
      candleLabel: lit ? 'You lit a candle' : 'Light a candle',
      light: function () { self.setState({ lit: true }); },
      rootStyle: 'width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(ellipse 110% 50% at 50% 100%, rgba(227,168,87,' + glow + '), rgba(15,15,16,0) 70%), #0F0F10; color: #D8D1C3; font-family: \'Newsreader\', Georgia, serif; display: flex; flex-direction: column; padding: 20px 24px 28px; transition: background 600ms',
      candleBtnStyle: 'display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 28px; border: 1px solid ' + (lit ? '#E3A857' : '#4A4842') + '; background: transparent; color: ' + (lit ? '#E3A857' : '#D8D1C3') + '; font-family: \'Newsreader\', Georgia, serif; font-size: 19px; font-style: italic; cursor: ' + (lit ? 'default' : 'pointer')
    };
  }
}
</script>


</body></html>
