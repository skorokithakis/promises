<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Promises (desktop)</title>
<script src="a6af286c-3db2-4219-afd8-e0f3243ae40b"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#F3F3F0}
a{color:#18191B}a:hover{color:#000}
input::placeholder{color:#9A9B9E}
input:focus{outline:none}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; background: #F3F3F0; color: #18191B; font-family: 'Newsreader', Georgia, serif">
  <header style="border-bottom: 1px solid #E2E2DE">
    <nav aria-label="Main" style="max-width: 1120px; margin: 0 auto; padding: 0 32px; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 32px">
      <a href="DesktopList.dc.html" style="font-size: 28px; text-decoration: none">Promises</a>
      <div style="display: flex; gap: 28px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px">
        <a href="DesktopList.dc.html" aria-current="page" style="min-height: 44px; display: flex; align-items: center; text-decoration: underline; text-underline-offset: 6px">Open</a>
        <sc-if value="{{hasHall}}" hint-placeholder-val="{{ true }}">
        <a href="DesktopHall.dc.html" style="min-height: 44px; display: flex; align-items: center; text-decoration: none; color: #5E6064">The hall ({{brokenCount}})</a>
        </sc-if>
      </div>
    </nav>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 56px 32px 80px; display: flex; flex-wrap: wrap; gap: 56px 72px; align-items: flex-start">
    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
      <form style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 20px; padding-bottom: 8px">
        <label for="new-promise" style="flex: 0 0 auto; font-size: 30px; font-style: italic; color: #5E6064; padding-bottom: 10px">I promise to</label>
        <input id="new-promise" type="text" placeholder="finally fix that tap" style="flex: 1 1 260px; min-width: 0; border: 0; border-bottom: 1px solid #18191B; background: transparent; padding: 0 0 10px; font-family: 'Newsreader', Georgia, serif; font-size: 30px; color: #18191B">
        <a href="DesktopPromised.dc.html" style="flex: 0 0 auto; height: 52px; padding: 0 28px; border-radius: 26px; background: #18191B; color: #F3F3F0; display: flex; align-items: center; text-decoration: none; font-size: 18px; font-style: italic">I promise</a>
      </form>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <p style="margin: 0 0 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5E6064; letter-spacing: 0.02em">{{countsLine}}</p>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{items}}" as="item" hint-placeholder-count="8">
            <li style="display: flex; gap: 16px; align-items: flex-start; padding: 20px 0; border-top: 1px solid #E2E2DE">
              <sc-if value="{{item.kept}}" hint-placeholder-val="{{ false }}">
                <button type="button" aria-label="{{item.label}}" style="flex: none; width: 44px; height: 44px; margin: -8px 0 0 -10px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center; cursor: default">
                  <span style="width: 24px; height: 24px; border-radius: 12px; background: #18191B; display: flex; align-items: center; justify-content: center">
                    <svg width="13" height="13" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F3F3F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                  </span>
                </button>
              </sc-if>
              <sc-if value="{{item.open}}" hint-placeholder-val="{{ true }}">
                <a href="DesktopKept.dc.html" aria-label="{{item.label}}" style="flex: none; width: 44px; height: 44px; margin: -8px 0 0 -10px; display: flex; align-items: center; justify-content: center">
                  <span style="{{item.ringStyle}}"></span>
                </a>
              </sc-if>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px">
                <span style="{{item.textStyle}}">{{item.text}}</span>
                <span style="flex: 0 0 auto; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5E6064">{{item.meta}}</span>
                <div style="flex: 1 0 100%; height: 2px; background: #E2E2DE; border-radius: 1px; overflow: hidden">
                  <div style="{{item.meterStyle}}"></div>
                </div>
              </div>
            </li>
          </sc-for>
        </ul>
      </div>
    </section>

    <aside style="flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 32px">
      <sc-if value="{{hasHall}}" hint-placeholder-val="{{ true }}">
      <a href="DesktopHall.dc.html" style="display: flex; flex-direction: column; gap: 18px; padding: 28px; background: #0F0F10; color: #D8D1C3; text-decoration: none">
        <span style="display: flex; align-items: center; gap: 10px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.2em; color: #9A9488">
          <svg width="10" height="14" sc-camel-view-box="0 0 22 30" aria-hidden="true"><path d="M11 1c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C5 9.5 7 6 11 1z" fill="#E3A857"></path></svg>
          RECENTLY BROKEN
        </span>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px">
          <li style="font-size: 19px; line-height: 1.25">Write the blog post about promises</li>
          <li style="font-size: 19px; line-height: 1.25">Clean out the garage</li>
          <li style="font-size: 19px; line-height: 1.25">Stop checking my phone in bed</li>
        </ol>
        <span style="font-size: 16px; font-style: italic; color: #9A9488">Visit the hall</span>
      </a>
      </sc-if>
      <p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; line-height: 1.7; color: #5E6064">You'd better keep your promises.</p>
    </aside>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;daysPassed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:30,&quot;step&quot;:1,&quot;unit&quot;:&quot;days&quot;,&quot;default&quot;:0,&quot;section&quot;:&quot;Time&quot;},&quot;newUser&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;State&quot;},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960}}">
class Component extends DCLogic {
  renderVals() {
    var LIFE = 30;
    var days = Number(this.props.daysPassed == null ? 0 : this.props.daysPassed);
    var kept = (this.state && this.state.kept) || {};
    var self = this;
    var base = [
      { id: 'a', text: 'Call Mum on Sunday', age: 1, made: '9 Oct' },
      { id: 'b', text: 'Fix the dripping tap in the bathroom', age: 4, made: '6 Oct' },
      { id: 'c', text: 'Back up the photos from the summer', age: 9, made: '1 Oct' },
      { id: 'd', text: 'Reply to Nikos about the boat trip', age: 13, made: '27 Sep' },
      { id: 'e', text: 'Learn to make proper sourdough', age: 17, made: '23 Sep' },
      { id: 'f', text: 'Go running three times a week', age: 21, made: '19 Sep' },
      { id: 'g', text: 'Read The Dispossessed', age: 25, made: '15 Sep' },
      { id: 'h', text: 'Write to my old teacher', age: 28, made: '12 Sep' }
    ];
    var newUser = !!this.props.newUser;
    if (newUser) { base = base.slice(0, 2); }
    var items = [];
    var lost = 0;
    var keptNow = 0;
    base.forEach(function (p) {
      var isKept = !!kept[p.id];
      var left = LIFE - (p.age + days);
      if (isKept) { keptNow++; }
      if (!isKept && left <= 0) { lost++; return; }
      var ink = isKept ? 1 : Math.max(0, Math.min(1, left / LIFE));
      var alpha = (0.12 + 0.88 * Math.pow(ink, 0.8)).toFixed(3);
      var blur = isKept ? 0 : (ink < 0.12 ? 1.1 : (ink < 0.25 ? 0.6 : (ink < 0.4 ? 0.25 : 0)));
      var spacing = ((1 - ink) * 0.035).toFixed(3);
      items.push({
        id: p.id,
        text: p.text,
        kept: isKept,
        open: !isKept,
        label: (isKept ? 'Kept: ' : 'Keep this promise: ') + p.text,
        textStyle: 'flex: 1 1 320px; min-width: 0; font-size: 24px; line-height: 1.3; color: rgba(24,25,27,' + alpha + '); filter: blur(' + blur + 'px); letter-spacing: ' + spacing + 'em; text-wrap: pretty',
        ringStyle: 'width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; border: 1.5px solid rgba(24,25,27,' + alpha + ')',
        meterStyle: 'height: 2px; width: ' + (ink * 100).toFixed(1) + '%; background: ' + (isKept ? '#18191B' : 'rgba(24,25,27,' + alpha + ')'),
        meta: isKept ? 'Promised ' + p.made + ' · kept today' : 'Promised ' + p.made,
        keep: function () { var k = Object.assign({}, kept); k[p.id] = true; self.setState({ kept: k }); }
      });
    });
    var openCount = items.length - keptNow;
    var keptCount = (newUser ? 0 : 14) + keptNow;
    var brokenCount = (newUser ? 0 : 31) + lost;
    var hasHall = brokenCount > 0;
    return {
      items: items,
      hasHall: hasHall,
      brokenCount: brokenCount,
      countsLine: openCount + ' open · ' + keptCount + ' kept' + (hasHall ? ' · ' + brokenCount + ' broken' : '')
    };
  }
}
</script>


</body></html>
