<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Hall of broken promises</title>
<script src="1375e870-0023-43fa-9e69-29ff6a725bf2"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#0F0F10}
a{color:#D8D1C3}a:hover{color:#F1EBDD}
@keyframes flicker{0%,100%{opacity:.85}45%{opacity:1}60%{opacity:.7}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(ellipse 120% 40% at 50% -6%, rgba(227,168,87,0.16), rgba(15,15,16,0) 70%), #0F0F10; color: #D8D1C3; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column">
  <header style="padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 28px">
    <a href="Main.dc.html" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 8px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #9A9488; text-decoration: none">
      <svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      Promises
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
      <svg width="22" height="30" sc-camel-view-box="0 0 22 30" aria-hidden="true" style="animation: flicker 3.2s ease-in-out infinite"><path d="M11 1c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C5 9.5 7 6 11 1z" fill="#E3A857"></path><rect x="7" y="20" width="8" height="10" fill="#3A3833"></rect></svg>
      <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.24em; color: #9A9488">THE HALL OF</span>
      <h1 style="margin: 0; font-size: 40px; font-weight: 300; font-style: italic; line-height: 1">Broken promises</h1>
      <p style="margin: 6px 0 0; font-size: 16px; color: #9A9488">31 things I said I would do. I thought I was better than I am.</p>
    </div>
  </header>

  <ol style="list-style: none; margin: 0; padding: 0 20px 32px; flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{plaques}}" as="p" hint-placeholder-count="7">
      <li>
        <a href="Broken.dc.html" style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid #2E2D2A; text-decoration: none; color: #D8D1C3">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #9A9488">
            <span>NO. {{p.no}}</span>
            <span style="display: flex; align-items: center; gap: 6px">
              <svg width="9" height="12" sc-camel-view-box="0 0 22 30" aria-hidden="true"><path d="M11 1c4 5 6 8.5 6 11.5a6 6 0 0 1-12 0C5 9.5 7 6 11 1z" fill="#E3A857"></path></svg>
              {{p.candles}}
            </span>
          </div>
          <span style="font-size: 22px; line-height: 1.25; text-wrap: pretty">{{p.text}}</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; color: #9A9488">{{p.dates}}</span>
        </a>
      </li>
    </sc-for>
  </ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    var rows = [
      [31, 'Write the blog post about promises', '2 Sep', '2 Oct 2026', 3],
      [30, 'Clean out the garage', '28 Aug', '27 Sep 2026', 0],
      [29, 'Stop checking my phone in bed', '20 Aug', '19 Sep 2026', 12],
      [28, 'Visit Grandma’s village before winter', '10 Aug', '9 Sep 2026', 5],
      [27, 'Learn twenty words of Japanese', '1 Aug', '31 Aug 2026', 1],
      [26, 'Floss every night', '22 Jul', '21 Aug 2026', 9],
      [25, 'Finish the novel I started in 2019', '3 Jul', '2 Aug 2026', 27]
    ];
    return {
      plaques: rows.map(function (r) {
        return { no: r[0], text: r[1], dates: 'Promised ' + r[2] + ' · broken ' + r[3], candles: r[4] };
      })
    };
  }
}
</script>


</body></html>
