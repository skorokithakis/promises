<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Promise made</title>
<script src="0279aa4f-a772-4a2a-9344-7adc8a3d81f9"></script>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0;background:#F3F3F0}
a{color:#18191B}a:hover{color:#000}
@keyframes soak{0%{opacity:0;filter:blur(10px);letter-spacing:0.12em}60%{opacity:.85;filter:blur(1.5px)}100%{opacity:1;filter:blur(0);letter-spacing:0}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes seg{from{opacity:0;transform:scaleY(0.2)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F3F0; color: #18191B; font-family: 'Newsreader', Georgia, serif; display: flex; flex-direction: column; padding: 28px 24px">
  <div style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 18px; font-style: italic; color: #5E6064; animation: rise 600ms ease-out both">I promise to</span>
      <p style="margin: 0; font-size: 40px; line-height: 1.15; text-wrap: balance; animation: soak 1600ms cubic-bezier(.3,.6,.2,1) 300ms both">Call Mum on Sunday</p>
    </div>

    <div style="display: flex; gap: 3px" aria-hidden="true">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="30">
        <span style="{{d.style}}"></span>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; animation: rise 700ms ease-out 2000ms both">
      <p style="margin: 0; font-size: 24px; font-style: italic">You have 30 days to keep it.</p>
      <p style="margin: 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: #5E6064">Promised 10 Oct 2026 · the ink runs out 9 Nov 2026</p>
    </div>
  </div>

  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 28px; border: 1px solid #18191B; color: #18191B; text-decoration: none; font-size: 19px; font-style: italic; animation: rise 600ms ease-out 2600ms both">Back to my promises</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var i = 0; i < 30; i++) {
      var a = (1 - i / 30) * 0.88 + 0.12;
      var delay = 1100 + i * 28;
      days.push({ style: 'flex: 1 1 0; height: 14px; border-radius: 1px; transform-origin: bottom; background: rgba(24,25,27,' + a.toFixed(3) + '); animation: seg 360ms ease-out ' + delay + 'ms both' });
    }
    return { days: days };
  }
}
</script>


</body></html>
